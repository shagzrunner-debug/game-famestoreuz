<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAND A–Z — Clothing Brand Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #141416;
    --surface2: #1d1d20;
    --border: #2a2a2e;
    --text: #f5f5f4;
    --muted: #8a8a90;
    --accent: #ffffff;
    --accent-dark: #0b0b0c;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 16px 48px;
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 980px; }

  /* ===== Made by plaque (top) ===== */
  .made-by {
    display: block; width: fit-content; margin: 0 auto 16px;
    background: var(--accent); color: var(--accent-dark);
    font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 8px 18px; border-radius: 999px;
  }

  /* ===== Header ===== */
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .logo { font-size: 28px; font-weight: 900; letter-spacing: -0.03em; }
  .logo .accent { color: var(--accent); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 14px; text-align: center; min-width: 86px;
  }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .progress-wrap { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .progress-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }

  /* ===== Letter grid ===== */
  .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .letter-btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: var(--radius); padding: 10px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-family: inherit; transition: background .15s, border-color .15s, transform .1s;
  }
  .letter-btn:hover { background: var(--surface2); }
  .letter-btn:active { transform: scale(0.96); }
  .letter-btn .l { font-size: 20px; font-weight: 900; line-height: 1; }
  .letter-btn .c { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .letter-btn.done { border-color: var(--accent); }
  .letter-btn.done .l { color: var(--accent); }
  .letter-btn.active { background: var(--accent); color: var(--accent-dark); border-color: var(--accent); }
  .letter-btn.active .c { color: var(--accent-dark); opacity: .7; }

  /* ===== Play panel ===== */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 22px; position: relative;
  }
  .panel-head { margin-bottom: 14px; }
  .panel-title { font-size: 20px; font-weight: 800; }
  .panel-title .big-letter {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: var(--accent-dark);
    margin-right: 10px; font-size: 22px; font-weight: 900; vertical-align: middle;
  }

  .slots { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2); border: 1px solid transparent; border-radius: 10px;
    padding: 4px 14px; min-height: 44px; color: var(--muted); font-size: 15px;
    transition: border-color .15s, background .15s;
  }
  .slot .num { font-size: 12px; font-weight: 700; opacity: .6; width: 16px; flex-shrink: 0; }
  .slot.empty-with-input { border-color: var(--border); }
  .slot.empty-with-input:focus-within { border-color: var(--accent); background: #232327; }
  .slot-input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 15px; font-weight: 600;
    background: transparent; border: 0; outline: none; color: var(--text); padding: 8px 0;
  }
  .slot-input::placeholder { color: var(--muted); font-weight: 400; }
  .slot.filled { background: #2c2c30; color: var(--text); font-weight: 600; }
  .slot.shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .slot.filled .num { opacity: 1; }
  .slot .rm {
    margin-left: auto; appearance: none; background: transparent; border: 0; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 2px 6px; border-radius: 6px; line-height: 1; flex-shrink: 0;
  }
  .slot .rm:hover { color: var(--text); }

  .msg { min-height: 22px; font-size: 13px; margin-top: 12px; color: var(--muted); font-weight: 600; }

  .btn {
    appearance: none; font-family: inherit; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    border-radius: 10px; padding: 11px 18px; cursor: pointer; transition: background .15s;
    text-decoration: none; display: inline-block;
  }
  .btn:hover { background: #26262a; }
  .btn-primary { background: var(--accent); color: var(--accent-dark); border-color: var(--accent); }
  .btn-primary:hover { background: #e8e8e6; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--text); background: var(--surface2); }

  /* ===== Discount / win overlay ===== */
  .win-overlay {
    position: fixed; inset: 0; background: rgba(11,11,12,.96); z-index: 50;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px;
  }
  .win-overlay[hidden] { display: none; }
  .win-card { max-width: 460px; }
  .win-card h1 { font-size: 38px; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 12px; }
  .win-card .discount {
    font-size: 26px; font-weight: 900; margin-bottom: 14px;
    border: 2px solid var(--accent); border-radius: 14px; padding: 14px 18px; display: inline-block;
  }
  .win-card p { color: var(--muted); font-size: 16px; margin-bottom: 8px; line-height: 1.5; }
  .win-card p b { color: var(--text); }
  .win-card .secret-note { font-size: 13px; margin-bottom: 18px; }
  .win-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

  canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  .footer { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) {
    .logo { font-size: 22px; }
    .letters { grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); }
    .panel { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="made-by">Made by FameStoreUz</div>

  <header>
    <div class="logo">BRAND <span class="accent">A–Z</span></div>
    <div class="stats">
      <div class="stat"><b id="st-letters">0/26</b><span>letters</span></div>
      <div class="stat"><b id="st-brands">0/130</b><span>brands</span></div>
      <button class="btn btn-ghost" id="reset-btn" title="Start over">↺ Reset</button>
    </div>
  </header>
  <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>

  <div class="letters" id="letters" role="group" aria-label="Letters"></div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="big-letter" id="cur-letter">A</span><span id="cur-title">Name 5 brands starting with A</span></div>
    </div>
    <div class="slots" id="slots"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </div>

  <div class="footer">Progress saves automatically in your browser</div>
</div>

<div class="win-overlay" id="win-overlay" hidden>
  <div class="win-card">
    <h1 id="win-title">🏆 ALL 26 LETTERS!</h1>
    <div class="discount">Вы получили скидку −10%</div>
    <p>Для подробностей напишите админу <b>@ESNTIL</b> в Telegram</p>
    <p class="secret-note" id="secret-note" hidden>✦ Секретный код принят ✦</p>
    <div class="win-actions">
      <a class="btn btn-primary" id="tg-admin" href="https://t.me/ESNTIL" target="_blank" rel="noopener">Написать админу в Telegram</a>
      <button class="btn" id="win-close">Закрыть</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function () {
  "use strict";

  var BRANDS = {
    a: ["Adidas","ASOS","Armani","Arc'teryx","Aimé Leon Dore","AMIRI","Ambush","Anta","Alpha Industries","Acne Studios","Awake NY","Alife","Aries","AllSaints","A.P.C.","Alexander Wang","AAPE","A Bathing Ape","Ader Error","Axel Arigato","Alaïa","Ann Demeulemeester","Anine Bing","Aquascutum","Aspesi","Avirex","Andersson Bell","Arte Antwerp"],
    b: ["BAPE","Balenciaga","Balmain","Barbour","Bershka","Billabong","Birkenstock","Bogner","Boss","Brioni","Brooks Brothers","Brunello Cucinelli","Burberry","Billionaire Boys Club","Ben Sherman","Bottega Veneta","Berluti","Boglioli","Bally","Belstaff","Baracuta","Blauer","Blundstone","Bodega","Brain Dead","Butter Goods","Boohoo","Billionaire Italian Couture"],
    c: ["C.P. Company","Calvin Klein","Carhartt","Celine","Champion","Chloé","Coach","Columbia","Comme des Garçons","Corteiz","Crocs","Cavalli","Chanel","Carhartt WIP","Casablanca","Chrome Hearts","Cav Empt","Celio","Colmar","Colorful Standard","Common Projects","CMMN SWDN","Comme des Garçons PLAY","Canali","Corneliani","Church's"],
    d: ["Danner","Descente","Dickies","Diesel","Dior","DKNY","Dockers","Dolce & Gabbana","Dr. Martens","Dries Van Noten","Dsquared2","Dunhill","Daily Paper","Dion Lee","Dondup","Danton","Dime","Drôle de Monsieur","Diamond Supply Co","De Bonne Facture"],
    e: ["Ed Hardy","Ellesse","Emporio Armani","Engineered Garments","Erdem","Evisu","Everlane","Etro","Eastpak","Ecko","Ermenegildo Zegna","Eckhaus Latta","Enfants Riches Déprimés","Ebbets Field Flannels","Essentials"],
    f: ["Facetasm","Fear of God","Fendi","Fila","Fjällräven","Fiorucci","Fred Perry","FrizmWORKS","Footpatrol","Filson","F.C. Real Bristol","Fumito Ganryu","Fusalp"],
    g: ["Gap","Ganni","Givenchy","Golden Goose","Golf Wang","G-Star Raw","Gucci","Gramicci","Grenson","Giorgio Armani","Goldwin","Gosha Rubchinskiy","GmbH"],
    h: ["Haider Ackermann","Helmut Lang","Heron Preston","Hermès","Helly Hansen","Huf","Hugo Boss","H&M","Human Made","Han Kjøbenhavn","Hood By Air","Hysteric Glamour","Homme Plissé Issey Miyake","Haversack","Hender Scheme"],
    i: ["Iceberg","Ice Cream","Isabel Marant","Issey Miyake","Ivy Park","IRO","Iuter","Iris van Herpen","Izzue"],
    j: ["Jacquemus","Jaded London","Jean Paul Gaultier","Jil Sander","Jordan","Joules","J.Crew","JW Anderson","Junya Watanabe","Juun.J","Just Don","JJJJound"],
    k: ["Kappa","Karl Kani","Kenzo","Kiko Kostadinov","Kith","Kolor","K-Way","Kapital","Kaptain Sunshine","Kiton"],
    l: ["Lacoste","Lanvin","Lee","Lemaire","Levi's","Loewe","Lonsdale","Loro Piana","Louis Vuitton","Lululemon","Lyle & Scott","Luar","Les Deux","Ludovic de Saint Sernin","LAD Musician","Lavenham","Les Benjamins","Lardini"],
    m: ["Maharishi","Mango","Marni","Marques'Almeida","Mastermind Japan","Max Mara","Missoni","Miu Miu","Moncler","Moschino","Moose Knuckles","Maison Margiela","MM6 Maison Margiela","Maison Mihara Yasuhiro","MKI Miyuki Zoku","Marshall Artist","Marine Serre"],
    n: ["Nanga","Nasty Gal","Needles","Neighborhood","New Balance","New Era","Noah","Norse Projects","N.Hoolywood","Nudie Jeans","Nanamica","Number (N)ine","Nonnative","Nemen"],
    o: ["Oakley","Obey","Off-White","Onitsuka Tiger","On Running","Opening Ceremony","Orlebar Brown","OAMC","Orslow","Outdoor Voices","Ottolinger","Our Legacy","Only NY"],
    p: ["Palace","Palm Angels","Patagonia","Patta","Paul Smith","Pleasures","Polo Ralph Lauren","Post Archive Faction","Prada","Pringle of Scotland","Proenza Schouler","Pretty Green","Pyer Moss","Puma","Pas Normal Studios","3.1 Phillip Lim"],
    q: ["Quiksilver","Qasimi","Quay","Quechua","Qilo"],
    r: ["Rag & Bone","Raf Simons","Ralph Lauren","Reebok","Represent","Rhude","Rick Owens","Rokit","Rocawear","Russell Athletic","Reformation","Rassvet","RRL"],
    s: ["Sacai","Saint Laurent","Salomon","Salvatore Ferragamo","Satisfy","Song for the Mute","Stella McCartney","Stone Island","Stray Rats","Stüssy","Suicoke","Supreme","Sneakersnstuff","SOPHNET","Slam Jam","Snow Peak","South2 West8","Stan Ray"],
    t: ["Telfar","Ten C","Thom Browne","Thisisneverthat","Timberland","Toga","Tommy Hilfiger","Topman","Tracksmith","Trophy Room","The North Face","Todd Snyder","TIGHTBOOTH","Tod's"],
    u: ["Ugg","Undefeated","Undercover","Umbro","Union LA","Uniqlo","Urban Outfitters","Uniform Bridge","Universal Works","United Arrows"],
    v: ["Valentino","Vans","Veja","Versace","Vetements","Visvim","Vivienne Westwood","Vlone","Von Dutch"],
    w: ["Wacko Maria","Wales Bonner","We11done","White Mountaineering","Wild Things","WTAPS","Wood Wood","Woolrich","Wrangler","Wasted Paris","WeSC","WIND AND SEA"],
    x: ["XLARGE","X-girl","Xoxogoodboy","Xander Zhou","Xtep","Xu Zhi"],
    y: ["Y-3","Yardsale","YMC","Yeezy","Yohji Yamamoto","Yves Saint Laurent","Y's"],
    z: ["Zadig & Voltaire","Zara","Zegna","Zimmermann","Z Zegna"]
  };

  var LETTERS = "abcdefghijklmnopqrstuvwxyz".split("");
  var NEED = 5, SAVE_KEY = "brand-az-save-v2";
  var SECRET = "referal0101";

  function norm(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ""); }

  // ----- Telegram Mini App integration -----
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#0b0b0c");
      tg.setBackgroundColor("#0b0b0c");
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
  }
  function haptic(type) {
    try {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type);
    } catch (e) {}
  }

  // ----- state -----
  var state = { found: {}, cur: "a", won: false };
  LETTERS.forEach(function (l) { state.found[l] = []; });

  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.found) {
        LETTERS.forEach(function (l) {
          if (Array.isArray(s.found[l])) {
            state.found[l] = s.found[l].filter(function (b) {
              return BRANDS[l].some(function (x) { return norm(x) === norm(b); });
            }).slice(0, NEED);
          }
        });
        state.cur = LETTERS.indexOf(s.cur) !== -1 ? s.cur : "a";
        state.won = !!s.won;
      }
    }
  } catch (e) {}

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ----- elements -----
  var lettersEl = document.getElementById("letters");
  var slotsEl = document.getElementById("slots");
  var msgEl = document.getElementById("msg");
  var curLetterEl = document.getElementById("cur-letter");
  var curTitleEl = document.getElementById("cur-title");
  var pbar = document.getElementById("pbar");
  var winOverlay = document.getElementById("win-overlay");
  var secretNote = document.getElementById("secret-note");
  var shakeTarget = null;

  function countAll() { return LETTERS.reduce(function (n, l) { return n + state.found[l].length; }, 0); }
  function lettersDone() { return LETTERS.filter(function (l) { return state.found[l].length >= NEED; }).length; }

  function renderLetters() {
    lettersEl.innerHTML = "";
    LETTERS.forEach(function (l) {
      var done = state.found[l].length;
      var b = document.createElement("button");
      b.className = "letter-btn" + (l === state.cur ? " active" : "") + (done >= NEED ? " done" : "");
      b.innerHTML = '<span class="l">' + l.toUpperCase() + '</span><span class="c">' + done + "/" + NEED + "</span>";
      b.addEventListener("click", function () {
        state.cur = l; save(); renderAll();
      });
      lettersEl.appendChild(b);
    });
  }

  function renderSlots() {
    slotsEl.innerHTML = "";
    var arr = state.found[state.cur];
    var firstEmpty = null;
    for (var i = 0; i < NEED; i++) {
      var d = document.createElement("div");
      if (arr[i]) {
        d.className = "slot filled";
        d.innerHTML = '<span class="num">✓</span><span>' + esc(arr[i]) + "</span>";
        var rm = document.createElement("button");
        rm.className = "rm"; rm.textContent = "✕"; rm.title = "Remove";
        (function (brand) {
          rm.addEventListener("click", function () {
            state.found[state.cur] = state.found[state.cur].filter(function (x) { return x !== brand; });
            save(); renderAll();
          });
        })(arr[i]);
        d.appendChild(rm);
      } else {
        d.className = "slot empty-with-input";
        d.innerHTML = '<span class="num">' + (i + 1) + '</span>';
        var inp = document.createElement("input");
        inp.type = "text";
        inp.className = "slot-input";
        inp.placeholder = "Type a brand and press Enter…";
        inp.autocomplete = "off";
        inp.spellcheck = false;
        inp.setAttribute("aria-label", "Brand " + (i + 1) + " for letter " + state.cur.toUpperCase());
        inp.addEventListener("keydown", makeKeyHandler(inp));
        d.appendChild(inp);
        if (!firstEmpty) firstEmpty = inp;
      }
      slotsEl.appendChild(d);
    }
    return firstEmpty;
  }

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function renderStats() {
    var total = countAll(), done = lettersDone();
    document.getElementById("st-letters").textContent = done + "/26";
    document.getElementById("st-brands").textContent = total + "/130";
    pbar.style.width = (total / (NEED * 26) * 100) + "%";
  }

  function setMsg(text) { msgEl.textContent = text; }

  function renderAll(focusFirst) {
    curLetterEl.textContent = state.cur.toUpperCase();
    curTitleEl.textContent = "Name 5 brands starting with " + state.cur.toUpperCase();
    renderLetters();
    var firstEmpty = renderSlots();
    renderStats();
    if (state.found[state.cur].length >= NEED) setMsg("✓ Letter complete — pick the next one!");
    else setMsg("");
    if (focusFirst !== false && firstEmpty) firstEmpty.focus();
    if (lettersDone() === 26 && !state.won) { state.won = true; save(); openDiscount(false); }
  }

  // ----- discount menu -----
  function openDiscount(fromSecret) {
    secretNote.hidden = !fromSecret;
    winOverlay.hidden = false;
    confettiBurst();
  }

  // ----- slot input handling -----
  function makeKeyHandler(inp) {
    return function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      var v = inp.value.trim();
      if (!v) return;
      var slot = inp.parentElement;
      // Secret keyword: type it in the first empty slot of letter A
      if (state.cur === "a" && norm(v) === norm(SECRET)) {
        inp.value = "";
        openDiscount(true);
        return;
      }
      var nv = norm(v);
      var match = BRANDS[state.cur].find(function (b) { return norm(b) === nv; });
      if (!match) {
        // brand may exist under a different letter
        var other = null;
        for (var li = 0; li < LETTERS.length; li++) {
          if (LETTERS[li] === state.cur) continue;
          if (BRANDS[LETTERS[li]].some(function (b) { return norm(b) === nv; })) {
            other = LETTERS[li];
            break;
          }
        }
        if (other) {
          setMsg("✕ “" + v + "” is a " + other.toUpperCase() + " brand — switch to letter " + other.toUpperCase() + "!");
        } else {
          setMsg("✕ “" + v + "” is not a known brand — try again.");
        }
        haptic("error");
        shake(slot);
        return;
      }
      if (state.found[state.cur].indexOf(match) !== -1) {
        setMsg("✕ Already added.");
        haptic("error");
        shake(slot);
        return;
      }
      state.found[state.cur].push(match);
      save();
      haptic("success");
      var remaining = NEED - state.found[state.cur].length;
      if (remaining === 0) {
        setMsg("✓ " + state.cur.toUpperCase() + " is done! " + (26 - lettersDone()) + " letters to go.");
      } else {
        setMsg("✓ Nice — " + remaining + " more to go.");
      }
      renderAll();
    };
  }

  function shake(el) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
  }

  // ----- reset -----
  document.getElementById("reset-btn").addEventListener("click", function () {
    if (!confirm("Reset all progress?")) return;
    state = { found: {}, cur: "a", won: false };
    LETTERS.forEach(function (l) { state.found[l] = []; });
    save(); renderAll();
  });

  document.getElementById("win-close").addEventListener("click", function () { winOverlay.hidden = true; });

  document.getElementById("tg-admin").addEventListener("click", function (e) {
    if (tg && tg.openTelegramLink) {
      e.preventDefault();
      tg.openTelegramLink("https://t.me/ESNTIL");
    }
  });

  // ----- confetti (black & white) -----
  function confettiBurst() {
    var canvas = document.getElementById("confetti");
    var ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    var colors = ["#ffffff", "#c9c9c9", "#8a8a90", "#f5f5f4", "#3a3a3e"];
    var parts = [];
    for (var i = 0; i < 160; i++) {
      parts.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.5,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3,
        rot: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
    var start = null;
    function frame(ts) {
      if (!start) start = ts;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (ts - start < 6000) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(frame);
  }

  renderAll();
})();
</script>
</body>
</html>
